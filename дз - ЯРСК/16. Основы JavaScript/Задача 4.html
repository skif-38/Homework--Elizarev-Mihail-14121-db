<!DOCTYPE html>
<html lang="ru">
<head>
    <title>Задачки со скриптами</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
</head>
<body>
    <h1>Задачки со скриптами</h1>
    <script>
        function camelize(str) {
            let words = str.split('-');
            let res = words[0];
            for (let i = 1; i < words.length; i++) {
                let word = words[i];
                res += word[0].toUpperCase() + word.slice(1);
            }
            return res;
        }
        let phrase = prompt("Задача 4: Введите фразу вида 'my-short-string'");
        let resPhrase = camelize(phrase);
        alert(resPhrase);
    </script>
</body>
</html>
