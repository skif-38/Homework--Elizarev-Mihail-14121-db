<!DOCTYPE html>
<html lang="ru">
<head>
    <title>Плавные переходы</title>
    <meta charset="utf-8">
    <link rel="stylesheet" href="Task19-1.css">
</head>
<body>
    <section class="card">
        <h1 class="question">HTML расшифровывается как «How To Meet Ladies»?</h1>

        <div class="yes-no-selector">
            <div class="paper-btn paper-btn-true">
                <input type="radio" name="answer" id="yes-answer">
                <label for="yes-answer">Правда</label>
            </div>
            <div class="paper-btn paper-btn-false">
                <input type="radio" name="answer" id="no-answer">
                <label for="no-answer">Ложь</label>
            </div>
        </div>

        <div class="checkbox-section">
            <h2>Какими браузерами вы пользуетесь?</h2>
            <div class="checkbox-list">
                <label class="check-label">
                    <input type="checkbox" class="check-input">
                    <span class="check-text">Google</span>
                </label>
                <label class="check-label">
                    <input type="checkbox" class="check-input">
                    <span class="check-text">Яндекс</span>
                </label>
                <label class="check-label">
                    <input type="checkbox" class="check-input">
                    <span class="check-text">Opera</span>
                </label>
                <label class="check-label">
                    <input type="checkbox" class="check-input">
                    <span class="check-text">Firefox</span>
                </label>
                <label class="check-label">
                    <input type="checkbox" class="check-input">
                    <span class="check-text">Другое</span>
                </label>
            </div>
        </div>
    </section>
</body>
</html>
